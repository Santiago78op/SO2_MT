<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe Print, Bradley Hand, Comic Sans MS, Comic Neue, cursive">
  <title>Figura 2 — Hub frente a switch: dominios de colisión</title>
  <desc>El hub crea un único dominio de colisión compartido en half-duplex; el switch crea un dominio independiente por cada puerto activo, en full-duplex.</desc>

  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#343a40"/>
    </marker>
  </defs>

  <style>
    .t   { font-size: 21px; fill: #212529; }
    .h   { font-size: 17px; font-weight: bold; }
    .lbl { font-size: 13px; fill: #495057; }
    .cap { font-size: 15px; font-weight: bold; }
    .sub { font-size: 12.5px; fill: #868e96; }
    .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2; }
    .lnk { stroke: #1971c2; stroke-width: 2.2; stroke-linecap: round; }
  </style>

  <text x="450" y="34" class="t" text-anchor="middle">Dominio de colisión: qué hace el hub y qué hace el switch</text>
  <line x1="450" y1="58" x2="450" y2="450" stroke="#dee2e6" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ================= IZQUIERDA — HUB ================= -->
  <text x="230" y="86" class="h" fill="#c92a2a" text-anchor="middle">HUB — un solo medio compartido</text>

  <ellipse cx="230" cy="243" rx="192" ry="76" fill="#e03131" fill-opacity="0.09" stroke="#e03131" stroke-width="2.4" stroke-dasharray="9 6"/>

  <rect x="50" y="150" width="360" height="46" rx="8" class="box"/>
  <text x="230" y="180" class="h" text-anchor="middle" fill="#c92a2a">HUB</text>

  <line x1="95"  y1="196" x2="95"  y2="290" class="lnk"/>
  <line x1="185" y1="196" x2="185" y2="290" class="lnk"/>
  <line x1="275" y1="196" x2="275" y2="290" class="lnk"/>
  <line x1="365" y1="196" x2="365" y2="290" class="lnk"/>

  <!-- colisión -->
  <g stroke="#e03131" stroke-width="2.6" stroke-linecap="round">
    <path d="M178,236 l14,14 M192,236 l-14,14 M185,231 l0,24 M173,243 l24,0"/>
    <path d="M268,236 l14,14 M282,236 l-14,14 M275,231 l0,24 M263,243 l24,0"/>
  </g>
  <text x="230" y="222" class="lbl" fill="#c92a2a" text-anchor="middle">¡colisión!</text>

  <g class="box">
    <rect x="60"  y="290" width="70" height="46" rx="6"/>
    <rect x="150" y="290" width="70" height="46" rx="6"/>
    <rect x="240" y="290" width="70" height="46" rx="6"/>
    <rect x="330" y="290" width="70" height="46" rx="6"/>
  </g>
  <g class="lbl" text-anchor="middle" font-size="13">
    <text x="95"  y="318">PC 1</text>
    <text x="185" y="318">PC 2</text>
    <text x="275" y="318">PC 3</text>
    <text x="365" y="318">PC 4</text>
  </g>

  <text x="230" y="376" class="cap" fill="#c92a2a" text-anchor="middle">1 dominio de colisión</text>
  <text x="230" y="400" class="sub" text-anchor="middle">half-duplex · CSMA/CD activo</text>
  <text x="230" y="422" class="sub" text-anchor="middle">Si dos equipos transmiten a la vez, ambas tramas</text>
  <text x="230" y="440" class="sub" text-anchor="middle">se destruyen y hay que retransmitir</text>

  <!-- ================= DERECHA — SWITCH ================= -->
  <text x="670" y="86" class="h" fill="#2f9e44" text-anchor="middle">SWITCH — un segmento por puerto</text>

  <g fill="#2f9e44" fill-opacity="0.10" stroke="#2f9e44" stroke-width="2.2" stroke-dasharray="9 6">
    <ellipse cx="535" cy="243" rx="41" ry="64"/>
    <ellipse cx="625" cy="243" rx="41" ry="64"/>
    <ellipse cx="715" cy="243" rx="41" ry="64"/>
    <ellipse cx="805" cy="243" rx="41" ry="64"/>
  </g>

  <rect x="490" y="150" width="360" height="46" rx="8" class="box"/>
  <text x="670" y="180" class="h" text-anchor="middle" fill="#2f9e44">SWITCH</text>

  <line x1="535" y1="196" x2="535" y2="290" class="lnk"/>
  <line x1="625" y1="196" x2="625" y2="290" class="lnk"/>
  <line x1="715" y1="196" x2="715" y2="290" class="lnk"/>
  <line x1="805" y1="196" x2="805" y2="290" class="lnk"/>

  <g stroke="#2f9e44" stroke-width="1.6" marker-end="url(#flecha)" opacity="0.55">
    <line x1="528" y1="210" x2="528" y2="276"/>
    <line x1="542" y1="276" x2="542" y2="210"/>
  </g>
  <text x="625" y="222" class="lbl" fill="#2f9e44" text-anchor="middle">ida y vuelta a la vez</text>

  <g class="box">
    <rect x="500" y="290" width="70" height="46" rx="6"/>
    <rect x="590" y="290" width="70" height="46" rx="6"/>
    <rect x="680" y="290" width="70" height="46" rx="6"/>
    <rect x="770" y="290" width="70" height="46" rx="6"/>
  </g>
  <g class="lbl" text-anchor="middle" font-size="13">
    <text x="535" y="318">PC 1</text>
    <text x="625" y="318">PC 2</text>
    <text x="715" y="318">PC 3</text>
    <text x="805" y="318">PC 4</text>
  </g>

  <text x="670" y="376" class="cap" fill="#2f9e44" text-anchor="middle">4 dominios de colisión</text>
  <text x="670" y="400" class="sub" text-anchor="middle">full-duplex · CSMA/CD desactivado</text>
  <text x="670" y="422" class="sub" text-anchor="middle">Un solo equipo por segmento: la colisión</text>
  <text x="670" y="440" class="sub" text-anchor="middle">es estructuralmente imposible</text>

  <!-- regla -->
  <text x="450" y="462" class="lbl" text-anchor="middle" font-size="13.5" fill="#212529">
    Regla de conteo: dominios de colisión de un switch = puertos con cable conectado. El hub no suma dominios: agranda uno.
  </text>
</svg>

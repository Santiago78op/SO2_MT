<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" font-family="Segoe Print, Bradley Hand, Comic Sans MS, Comic Neue, cursive">
  <title>Figura 19 — Root Bridge por VLAN y puertos bloqueados</title>
  <desc>Las dos zonas del campus con camino redundante: el anillo del Centro de I+D y el triángulo del Edificio Corporativo. En cada una, el Root Bridge de su VLAN lleva corona y el puerto sobrante queda bloqueado, con el nombre exacto de la interfaz.</desc>

  <style>
    .t   { font-size: 21px; fill: #212529; }
    .h   { font-size: 15px; font-weight: bold; }
    .sw  { fill: #fff; stroke: #343a40; stroke-width: 2.2; }
    .swt { font-size: 12.5px; font-weight: bold; fill: #343a40; }
    .rol { font-size: 10px; fill: #868e96; }
    .fwd { stroke: #2f9e44; stroke-width: 3.4; stroke-linecap: round; fill: none; }
    .blk { stroke: #e03131; stroke-width: 3; stroke-dasharray: 9 6; stroke-linecap: round; fill: none; }
    .med { font-size: 10.5px; fill: #495057; }
    .red { font-size: 11.5px; font-weight: bold; fill: #c92a2a; }
    .sub { font-size: 12.5px; fill: #868e96; }
  </style>

  <text x="580" y="32" class="t" text-anchor="middle">El árbol que STP construye: una raíz por VLAN, un puerto bloqueado por ciclo</text>

  <!-- ================= I+D ================= -->
  <text x="290" y="72" class="h" fill="#0c8599" text-anchor="middle">VLAN 24 INVESTIGACION — anillo del Centro de I+D</text>
  <rect x="40" y="86" width="500" height="380" rx="14" fill="#0c8599" fill-opacity="0.05" stroke="#0c8599" stroke-width="1.8" stroke-dasharray="9 6"/>

  <!-- corona -->
  <g transform="translate(290,124)">
    <path d="M-24,7 L-24,-7 L-12,2 L0,-11 L12,2 L24,-7 L24,7 Z" fill="#f59f00" stroke="#e8590c" stroke-width="1.6"/>
  </g>
  <rect x="195" y="136" width="190" height="52" rx="8" class="sw" stroke="#2f9e44" stroke-width="3"/>
  <text x="290" y="158" class="swt" text-anchor="middle">SW-DIST-ID</text>
  <text x="290" y="176" class="rol" text-anchor="middle" fill="#2f9e44">ROOT · prioridad 24576 + 24</text>

  <path d="M240,188 L150,250" class="fwd"/>
  <path d="M340,188 L430,250" class="fwd"/>
  <text x="168" y="226" class="med" fill="#2f9e44">1 G · costo 4</text>
  <text x="412" y="226" class="med" text-anchor="end" fill="#2f9e44">1 G · costo 4</text>

  <rect x="80" y="250" width="140" height="52" rx="8" class="sw"/>
  <text x="150" y="272" class="swt" text-anchor="middle">SW-ID-1</text>
  <text x="150" y="290" class="rol" text-anchor="middle">prio 28672 + 24</text>
  <rect x="360" y="250" width="140" height="52" rx="8" class="sw"/>
  <text x="430" y="272" class="swt" text-anchor="middle">SW-ID-3</text>
  <text x="430" y="290" class="rol" text-anchor="middle">prio 32768 + 24</text>
  <rect x="220" y="376" width="140" height="52" rx="8" class="sw"/>
  <text x="290" y="398" class="swt" text-anchor="middle">SW-ID-2</text>
  <text x="290" y="416" class="rol" text-anchor="middle">prio 32768 + 24</text>

  <!-- cierre del anillo: BLOQUEADO -->
  <path d="M220,276 L360,276" class="blk"/>
  <g transform="translate(340,260)">
    <rect x="0" y="7" width="18" height="14" rx="3" fill="#e03131"/>
    <path d="M3,7 V4.5 a6,6 0 0 1 12,0 V7" fill="none" stroke="#e03131" stroke-width="2.2"/>
  </g>
  <text x="290" y="268" class="red" text-anchor="middle">Fa0/24 · Altn BLK</text>
  <text x="290" y="316" class="med" text-anchor="middle" fill="#c92a2a">100 Mbps · costo 19 — el enlace más lento, el candidato natural</text>

  <!-- ID-1 -> ID-2 forwarding -->
  <path d="M170,302 L250,376" class="fwd"/>
  <text x="182" y="348" class="med" fill="#2f9e44">costo 4</text>
  <!-- ID-2 -> ID-3 bloqueado -->
  <path d="M340,376 L410,302" class="blk"/>
  <g transform="translate(346,352)">
    <rect x="0" y="7" width="18" height="14" rx="3" fill="#e03131"/>
    <path d="M3,7 V4.5 a6,6 0 0 1 12,0 V7" fill="none" stroke="#e03131" stroke-width="2.2"/>
  </g>
  <text x="404" y="352" class="red" text-anchor="start">Gi0/2 · BLK</text>

  <text x="290" y="446" class="sub" text-anchor="middle" font-size="10.5">SW-ID-2 alcanza la raíz por SW-ID-1, de BID menor:</text>
  <text x="290" y="460" class="sub" text-anchor="middle" font-size="10.5">su otro puerto queda no designado.</text>

  <!-- ================= CORPORATIVO ================= -->
  <text x="850" y="72" class="h" fill="#7048e8" text-anchor="middle">VLAN 14 GERENCIA — triángulo del Corporativo</text>
  <rect x="580" y="86" width="540" height="380" rx="14" fill="#7048e8" fill-opacity="0.05" stroke="#7048e8" stroke-width="1.8" stroke-dasharray="9 6"/>

  <g transform="translate(850,124)">
    <path d="M-24,7 L-24,-7 L-12,2 L0,-11 L12,2 L24,-7 L24,7 Z" fill="#f59f00" stroke="#e8590c" stroke-width="1.6"/>
  </g>
  <rect x="742" y="136" width="216" height="52" rx="8" class="sw" stroke="#2f9e44" stroke-width="3"/>
  <text x="850" y="158" class="swt" text-anchor="middle">SW-DIST-CORP</text>
  <text x="850" y="176" class="rol" text-anchor="middle" fill="#2f9e44">ROOT · prioridad 24576 + 14</text>

  <path d="M790,188 L700,278" class="fwd"/>
  <path d="M910,188 L1000,278" class="fwd"/>
  <text x="712" y="240" class="med" fill="#2f9e44">1 G · costo 4</text>
  <text x="988" y="240" class="med" text-anchor="end" fill="#2f9e44">1 G · costo 4</text>

  <rect x="620" y="278" width="160" height="52" rx="8" class="sw"/>
  <text x="700" y="300" class="swt" text-anchor="middle">SW-ALA-A</text>
  <text x="700" y="318" class="rol" text-anchor="middle">prio 28672 + 14</text>
  <rect x="920" y="278" width="160" height="52" rx="8" class="sw"/>
  <text x="1000" y="300" class="swt" text-anchor="middle">SW-ALA-B</text>
  <text x="1000" y="318" class="rol" text-anchor="middle">prio 32768 + 14</text>

  <path d="M780,304 L920,304" class="blk"/>
  <g transform="translate(898,288)">
    <rect x="0" y="7" width="18" height="14" rx="3" fill="#e03131"/>
    <path d="M3,7 V4.5 a6,6 0 0 1 12,0 V7" fill="none" stroke="#e03131" stroke-width="2.2"/>
  </g>
  <text x="850" y="296" class="red" text-anchor="middle">Gi0/2 · Altn BLK</text>
  <text x="850" y="346" class="med" text-anchor="middle" fill="#c92a2a">Enlace directo de respaldo, 60 m — bloqueado en operación normal</text>

  <g>
    <rect x="620" y="372" width="160" height="44" rx="6" fill="#7048e8" fill-opacity="0.16" stroke="#7048e8" stroke-width="1.8"/>
    <text x="700" y="392" font-size="11" fill="#495057" text-anchor="middle">3 PC gerencia</text>
    <text x="700" y="408" font-size="10" fill="#868e96" text-anchor="middle">VLAN 14</text>
    <rect x="920" y="372" width="160" height="44" rx="6" fill="#7048e8" fill-opacity="0.16" stroke="#7048e8" stroke-width="1.8"/>
    <text x="1000" y="392" font-size="11" fill="#495057" text-anchor="middle">3 PC gerencia</text>
    <text x="1000" y="408" font-size="10" fill="#868e96" text-anchor="middle">VLAN 14</text>
  </g>
  <path d="M700,330 L700,372" class="fwd" stroke-width="2.4"/>
  <path d="M1000,330 L1000,372" class="fwd" stroke-width="2.4"/>

  <text x="850" y="446" class="sub" text-anchor="middle" font-size="10.5">Ambas alas empatan a costo 4. Desempata el BID: ALA-A lleva 28672,</text>
  <text x="850" y="460" class="sub" text-anchor="middle" font-size="10.5">gana el puerto designado del segmento, y ALA-B bloquea.</text>

  <!-- ================= TABLA RESUMEN ================= -->
  <rect x="40" y="490" width="1080" height="190" rx="12" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="580" y="516" class="h" fill="#343a40" text-anchor="middle" font-size="14">Raíz por VLAN — las tres VLANs sin ciclo no tienen nada que bloquear</text>

  <g font-size="12">
    <text x="90"  y="548" fill="#495057" font-weight="bold">VLAN</text>
    <text x="260" y="548" fill="#495057" font-weight="bold">Root Bridge</text>
    <text x="520" y="548" fill="#495057" font-weight="bold">Puerto bloqueado</text>
    <text x="790" y="548" fill="#495057" font-weight="bold">Por qué ahí</text>
  </g>
  <line x1="70" y1="558" x2="1090" y2="558" stroke="#dee2e6" stroke-width="1.5"/>

  <g font-size="11.5" fill="#495057">
    <text x="90"  y="580" fill="#7048e8" font-weight="bold">14 GERENCIA</text>
    <text x="260" y="580">SW-DIST-CORP (24576)</text>
    <text x="520" y="580" fill="#c92a2a">SW-ALA-B Gi0/2</text>
    <text x="790" y="580">La raíz en el distribuidor deja el bloqueo en el respaldo</text>

    <text x="90"  y="604" fill="#0c8599" font-weight="bold">24 INVESTIGACION</text>
    <text x="260" y="604">SW-DIST-ID (24576)</text>
    <text x="520" y="604" fill="#c92a2a">SW-ID-3 Fa0/24 · SW-ID-2 Gi0/2</text>
    <text x="790" y="604">Bloqueo dentro del anillo, en el enlace de 100 Mbps</text>

    <text x="90"  y="628" fill="#f08c00" font-weight="bold">34 PRODUCCION</text>
    <text x="260" y="628">SW-CORE (24576)</text>
    <text x="520" y="628" fill="#2f9e44">ninguno</text>
    <text x="790" y="628">Enlace único Core ↔ Planta: no hay ciclo</text>

    <text x="90"  y="652" fill="#343a40" font-weight="bold">44 SERVIDORES</text>
    <text x="260" y="652">SW-CORE (24576)</text>
    <text x="520" y="652" fill="#2f9e44">ninguno</text>
    <text x="790" y="652">Po1 es un solo enlace lógico para STP (§7.3)</text>

    <text x="90"  y="676" fill="#d6336c" font-weight="bold">54 VISITANTES</text>
    <text x="260" y="676">SW-DIST-CORP (24576)</text>
    <text x="520" y="676" fill="#2f9e44">ninguno</text>
    <text x="790" y="676">Enlace único a SW-COMUNES</text>
  </g>
</svg>

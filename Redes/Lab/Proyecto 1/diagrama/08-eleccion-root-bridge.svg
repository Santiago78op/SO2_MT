<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Segoe Print, Bradley Hand, Comic Sans MS, Comic Neue, cursive">
  <title>Figura 8 — Elección del Root Bridge y bloqueo de puerto</title>
  <desc>El switch con el Bridge ID más bajo se convierte en Root Bridge. Cada switch no raíz elige como Root Port el de menor costo acumulado hacia la raíz, y el puerto sobrante del ciclo queda bloqueado.</desc>

  <style>
    .t   { font-size: 20px; fill: #212529; }
    .sw  { fill: #f8f9fa; stroke: #343a40; stroke-width: 2.2; }
    .swt { font-size: 15px; font-weight: bold; fill: #343a40; }
    .bid { font-size: 10.5px; fill: #495057; }
    .lnk { stroke: #343a40; stroke-width: 4; stroke-linecap: round; }
    .grn { font-size: 12px; font-weight: bold; fill: #2f9e44; }
    .red { font-size: 12px; font-weight: bold; fill: #c92a2a; }
    .sub { font-size: 12.5px; fill: #868e96; }
    .cost{ font-size: 12.5px; font-weight: bold; fill: #1971c2; }
  </style>

  <text x="490" y="30" class="t" text-anchor="middle">El Bridge ID elige la raíz; el costo acumulado decide qué puerto se bloquea</text>

  <!-- ENLACES -->
  <line x1="490" y1="192" x2="288" y2="330" class="lnk"/>
  <line x1="490" y1="192" x2="692" y2="330" class="lnk"/>
  <line x1="320" y1="392" x2="660" y2="392" class="lnk" stroke="#e03131" stroke-dasharray="10 7"/>

  <text x="366" y="246" class="cost" text-anchor="middle">costo 4</text>
  <text x="372" y="262" class="sub" text-anchor="middle">1 Gbps</text>
  <text x="614" y="246" class="cost" text-anchor="middle">costo 4</text>
  <text x="608" y="262" class="sub" text-anchor="middle">1 Gbps</text>
  <text x="490" y="382" class="cost" text-anchor="middle">costo 19</text>
  <text x="490" y="366" class="sub" text-anchor="middle">100 Mbps</text>

  <!-- ROOT -->
  <g transform="translate(490,108)">
    <path d="M-26,8 L-26,-8 L-13,2 L0,-12 L13,2 L26,-8 L26,8 Z" fill="#f59f00" stroke="#e8590c" stroke-width="1.8"/>
  </g>
  <rect x="405" y="122" width="170" height="70" rx="8" class="sw" stroke="#2f9e44" stroke-width="3"/>
  <text x="490" y="146" class="swt" text-anchor="middle">SW-1</text>
  <text x="490" y="164" class="bid" text-anchor="middle">Prioridad 24576 + MAC ...0A:11</text>
  <text x="490" y="182" class="grn" text-anchor="middle">ROOT BRIDGE — BID más bajo</text>

  <!-- SW-2 -->
  <rect x="150" y="326" width="170" height="70" rx="8" class="sw"/>
  <text x="235" y="350" class="swt" text-anchor="middle">SW-2</text>
  <text x="235" y="368" class="bid" text-anchor="middle">Prioridad 32768 + MAC ...0B:22</text>
  <text x="235" y="386" class="sub" text-anchor="middle">costo a la raíz: 4</text>

  <!-- SW-3 -->
  <rect x="660" y="326" width="170" height="70" rx="8" class="sw"/>
  <text x="745" y="350" class="swt" text-anchor="middle">SW-3</text>
  <text x="745" y="368" class="bid" text-anchor="middle">Prioridad 32768 + MAC ...0C:33</text>
  <text x="745" y="386" class="sub" text-anchor="middle">costo a la raíz: 4</text>

  <!-- puertos -->
  <circle cx="300" cy="320" r="8" fill="#2f9e44"/>
  <text x="258" y="306" class="grn" text-anchor="middle">Root Port</text>
  <circle cx="680" cy="320" r="8" fill="#2f9e44"/>
  <text x="724" y="306" class="grn" text-anchor="middle">Root Port</text>
  <circle cx="452" cy="206" r="8" fill="#1971c2"/>
  <circle cx="528" cy="206" r="8" fill="#1971c2"/>
  <text x="490" y="228" class="sub" text-anchor="middle" fill="#1971c2">Designated (la raíz siempre designa)</text>

  <!-- puerto bloqueado -->
  <circle cx="660" cy="392" r="9" fill="#fff" stroke="#e03131" stroke-width="3"/>
  <g transform="translate(592,398)">
    <rect x="0" y="9" width="20" height="16" rx="3" fill="#e03131"/>
    <path d="M4,9 V6 a6,6 0 0 1 12,0 V9" fill="none" stroke="#e03131" stroke-width="2.4"/>
  </g>
  <text x="742" y="424" class="red" text-anchor="middle">Altn · BLK</text>
  <text x="742" y="440" class="sub" text-anchor="middle" fill="#c92a2a">el cable sigue conectado;</text>
  <text x="742" y="456" class="sub" text-anchor="middle" fill="#c92a2a">no reenvía datos, sí escucha BPDU</text>

  <text x="235" y="424" class="sub" text-anchor="middle">Empate en costo (4 y 4): desempata</text>
  <text x="235" y="440" class="sub" text-anchor="middle">el BID del vecino. SW-2 (…0B) gana</text>
  <text x="235" y="456" class="sub" text-anchor="middle">a SW-3 (…0C), así que bloquea SW-3.</text>

  <!-- estados -->
  <rect x="100" y="486" width="780" height="112" rx="12" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="490" y="510" class="sub" text-anchor="middle" font-size="13.5" fill="#343a40" font-weight="bold">Qué tarda un puerto bloqueado en tomar el relevo (PVST+)</text>

  <g>
    <rect x="140" y="524" width="150" height="34" rx="6" fill="#ffe3e3" stroke="#e03131" stroke-width="1.8"/>
    <text x="215" y="546" font-size="12" fill="#c92a2a" text-anchor="middle">Blocking</text>
    <rect x="320" y="524" width="150" height="34" rx="6" fill="#fff3bf" stroke="#f08c00" stroke-width="1.8"/>
    <text x="395" y="546" font-size="12" fill="#a15c07" text-anchor="middle">Listening · 15 s</text>
    <rect x="500" y="524" width="150" height="34" rx="6" fill="#fff3bf" stroke="#f08c00" stroke-width="1.8"/>
    <text x="575" y="546" font-size="12" fill="#a15c07" text-anchor="middle">Learning · 15 s</text>
    <rect x="680" y="524" width="150" height="34" rx="6" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.8"/>
    <text x="755" y="546" font-size="12" fill="#2f9e44" text-anchor="middle">Forwarding</text>
  </g>
  <g fill="#868e96">
    <path d="M292,541 L316,541 M296,536 l6,5 l-6,5" stroke="#868e96" stroke-width="2" fill="none"/>
    <path d="M472,541 L496,541 M476,536 l6,5 l-6,5" stroke="#868e96" stroke-width="2" fill="none"/>
    <path d="M652,541 L676,541 M656,536 l6,5 l-6,5" stroke="#868e96" stroke-width="2" fill="none"/>
  </g>
  <text x="490" y="582" class="sub" text-anchor="middle">Total <tspan font-weight="bold">30 s</tspan>, y hasta <tspan font-weight="bold">50 s</tspan> si antes hay que esperar el <tspan font-style="italic">max age</tspan> de 20 s. Es el número a contrastar en la prueba de falla.</text>
</svg>

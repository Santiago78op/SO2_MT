<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Segoe Print, Bradley Hand, Comic Sans MS, Comic Neue, cursive">
  <title>Figura 6 — El Server anuncia, el Client adopta, el Transparent reenvía sin adoptar</title>
  <desc>Cadena de cuatro switches en el dominio VTP Smart_8. El Server crea las VLANs y las anuncia; los Client las adoptan; el Transparent deja pasar el anuncio pero conserva su propia base de VLANs, que es lo que aísla la administración del switch de visitantes.</desc>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#1971c2"/>
    </marker>
  </defs>

  <style>
    .t   { font-size: 20px; fill: #212529; }
    .sw  { fill: #f8f9fa; stroke: #343a40; stroke-width: 2.2; }
    .swt { font-size: 14px; font-weight: bold; fill: #343a40; }
    .md  { font-size: 12.5px; font-weight: bold; }
    .db  { font-size: 10.5px; fill: #495057; }
    .sub { font-size: 12.5px; fill: #868e96; }
  </style>

  <text x="490" y="30" class="t" text-anchor="middle">Dominio VTP <tspan font-weight="bold">Smart_8</tspan> — quién anuncia, quién adopta, quién sólo deja pasar</text>

  <!-- banda de dominio -->
  <rect x="26" y="52" width="928" height="270" rx="26" fill="#1971c2" fill-opacity="0.05" stroke="#4dabf7" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="490" y="74" class="sub" text-anchor="middle" fill="#1971c2">contraseña <tspan font-weight="bold">proyecto12S2026</tspan> — un switch sin ella no es escuchado</text>

  <!-- switches -->
  <g class="sw">
    <rect x="46"  y="96" width="180" height="58" rx="8"/>
    <rect x="276" y="96" width="180" height="58" rx="8"/>
    <rect x="506" y="96" width="180" height="58" rx="8"/>
    <rect x="736" y="96" width="180" height="58" rx="8"/>
  </g>
  <g class="swt" text-anchor="middle">
    <text x="136" y="122">SW-CORE</text>
    <text x="366" y="122">SW-DIST-CORP</text>
    <text x="596" y="122">SW-COMUNES</text>
    <text x="826" y="122">SW-ALA-A</text>
  </g>
  <g class="md" text-anchor="middle">
    <text x="136" y="142" fill="#2f9e44">VTP SERVER</text>
    <text x="366" y="142" fill="#1971c2">VTP CLIENT</text>
    <text x="596" y="142" fill="#c92a2a">VTP TRANSPARENT</text>
    <text x="826" y="142" fill="#1971c2">VTP CLIENT</text>
  </g>

  <!-- trunks + anuncios -->
  <g stroke="#343a40" stroke-width="4" stroke-linecap="round">
    <line x1="226" y1="125" x2="276" y2="125"/>
    <line x1="456" y1="125" x2="506" y2="125"/>
    <line x1="686" y1="125" x2="736" y2="125"/>
  </g>

  <!-- flecha de anuncio que atraviesa todo -->
  <line x1="136" y1="176" x2="826" y2="176" stroke="#1971c2" stroke-width="3" stroke-dasharray="11 6" marker-end="url(#a)"/>
  <text x="250" y="168" class="sub" fill="#1971c2">anuncio VTP · revisión n+1</text>
  <text x="640" y="168" class="sub" fill="#1971c2">lo reenvía, pero no lo adopta</text>

  <!-- bases de VLANs -->
  <g stroke-width="2" fill="#fff">
    <rect x="46"  y="196" width="180" height="104" rx="8" stroke="#2f9e44"/>
    <rect x="276" y="196" width="180" height="104" rx="8" stroke="#1971c2"/>
    <rect x="506" y="196" width="180" height="104" rx="8" stroke="#c92a2a"/>
    <rect x="736" y="196" width="180" height="104" rx="8" stroke="#1971c2"/>
  </g>

  <g class="db" text-anchor="middle">
    <text x="136" y="216" font-weight="bold" fill="#2f9e44">crea y anuncia</text>
    <text x="136" y="236">14 GERENCIA</text>
    <text x="136" y="252">24 INVESTIGACION</text>
    <text x="136" y="268">34 PRODUCCION</text>
    <text x="136" y="284">44 SERVIDORES · 54 VISITANTES</text>

    <text x="366" y="216" font-weight="bold" fill="#1971c2">adopta ✔</text>
    <text x="366" y="236">14 GERENCIA</text>
    <text x="366" y="252">24 INVESTIGACION</text>
    <text x="366" y="268">34 PRODUCCION</text>
    <text x="366" y="284">44 SERVIDORES · 54 VISITANTES</text>

    <text x="596" y="216" font-weight="bold" fill="#c92a2a">base propia · no adopta</text>
    <text x="596" y="240" font-size="12" fill="#d6336c" font-weight="bold">54 VISITANTES</text>
    <text x="596" y="258" font-size="12" fill="#868e96">94 nativa</text>
    <text x="596" y="286" font-size="11" fill="#c92a2a">no conoce la 14, 24, 34 ni 44</text>

    <text x="826" y="216" font-weight="bold" fill="#1971c2">adopta ✔</text>
    <text x="826" y="236">14 GERENCIA</text>
    <text x="826" y="252">24 INVESTIGACION</text>
    <text x="826" y="268">34 PRODUCCION</text>
    <text x="826" y="284">44 SERVIDORES · 54 VISITANTES</text>
  </g>

  <!-- candado sobre el transparent -->
  <g transform="translate(662,204)">
    <rect x="0" y="8" width="20" height="16" rx="3" fill="#c92a2a"/>
    <path d="M4,8 V5 a6,6 0 0 1 12,0 V8" fill="none" stroke="#c92a2a" stroke-width="2.4"/>
  </g>

  <!-- pie -->
  <rect x="120" y="348" width="740" height="124" rx="12" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="490" y="374" class="sub" text-anchor="middle" font-size="13.5" fill="#343a40" font-weight="bold">Lo que hace útil al modo Transparent</text>
  <text x="490" y="398" class="sub" text-anchor="middle">Reenvía el anuncio, así que <tspan font-weight="bold">no rompe la cadena</tspan>: SW-ALA-A sigue recibiendo sus VLANs.</text>
  <text x="490" y="420" class="sub" text-anchor="middle">Pero no lo adopta, así que su base de VLANs es local y editable a mano.</text>
  <text x="490" y="446" class="sub" text-anchor="middle" fill="#c92a2a">Ése es el «aislamiento de administración de VLANs» que pide el enunciado para las Áreas Comunes:</text>
  <text x="490" y="464" class="sub" text-anchor="middle" fill="#c92a2a">el switch de visitantes ni siquiera sabe que existe la VLAN 44 de servidores.</text>
</svg>

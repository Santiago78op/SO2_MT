# Especificación de topología — Proyecto 1 "SmartCity Tech Park"
# Fuente única y legible por máquina para construir Proyecto1_201905884.pkt.
# Deriva de README.md §11.1, §13, §14, §18, §19 y §20. Si algo difiere, manda el README.
# Formato: YAML. Las interfaces de los chasis modulares son PREVISTAS (ver nota al final).

meta:
  carne: "201905884"
  archivo_pkt: "Proyecto1_201905884.pkt"
  packet_tracer_min: "8.0"
  vlan_nativa: 94
  stp_mode: "pvst"              # carné par
  etherchannel_protocol: "lacp" # carné par
  banner_motd: "Acceso Restringido - TechPark_201905884"
  vtp:
    dominio: "Smart_8"
    password: "proyecto12S2026"
    version: 2

vlans:
  - {id: 14,  nombre: "GERENCIA",      area: "Edificio Corporativo",   color: "#7048e8"}
  - {id: 24,  nombre: "INVESTIGACION", area: "Centro de I+D",          color: "#0c8599"}
  - {id: 34,  nombre: "PRODUCCION",    area: "Planta de Produccion",   color: "#f08c00"}
  - {id: 44,  nombre: "SERVIDORES",    area: "Centro de Datos",        color: "#343a40"}
  - {id: 54,  nombre: "VISITANTES",    area: "Areas Comunes",          color: "#d6336c"}
  - {id: 94,  nombre: "NATIVA",        area: "todos los trunks",       color: "#adb5bd", sin_puertos_access: true}
  - {id: 999, nombre: "SIN-USO",       area: "puertos apagados",       color: "#ced4da", sin_puertos_access: true}

switches:
  - hostname: SW-CORE
    modelo_pt: "Switch-PT (modular, modulos de fibra + cobre Gigabit)"
    area: "Centro de Datos"
    rol: "core"
    vtp_mode: server
    banner: true
    stp: {primary: [34, 44], secondary: [14, 24, 54]}

  - hostname: SW-SRV
    modelo_pt: "2960-24TT"
    area: "Centro de Datos"
    rol: "acceso"
    vtp_mode: client
    banner: false

  - hostname: SW-DIST-ID
    modelo_pt: "Switch-PT (modular)"
    area: "Centro de I+D"
    rol: "distribucion"
    vtp_mode: client
    banner: true
    stp: {primary: [24]}

  - hostname: SW-ID-1
    modelo_pt: "2960-24TT"
    area: "Centro de I+D"
    rol: "acceso"
    vtp_mode: client
    banner: false
    stp: {priority: {24: 28672}}   # hace determinista el bloqueo del anillo

  - hostname: SW-ID-2
    modelo_pt: "2960-24TT"
    area: "Centro de I+D"
    rol: "acceso"
    vtp_mode: client
    banner: false

  - hostname: SW-ID-3
    modelo_pt: "2960-24TT"
    area: "Centro de I+D"
    rol: "acceso"
    vtp_mode: client
    banner: false

  - hostname: SW-DIST-CORP
    modelo_pt: "Switch-PT (modular)"
    area: "Edificio Corporativo"
    rol: "distribucion"
    vtp_mode: client
    banner: true
    stp: {primary: [14, 54]}

  - hostname: SW-ALA-A
    modelo_pt: "2960-24TT"
    area: "Edificio Corporativo"
    rol: "acceso"
    vtp_mode: client
    banner: false
    stp: {priority: {14: 28672}}   # desempata el enlace Ala A <-> Ala B

  - hostname: SW-ALA-B
    modelo_pt: "2960-24TT"
    area: "Edificio Corporativo"
    rol: "acceso"
    vtp_mode: client
    banner: false

  - hostname: SW-COMUNES
    modelo_pt: "2960-24TT"
    area: "Edificio Corporativo (Areas Comunes)"
    rol: "acceso"
    vtp_mode: transparent          # aislamiento de administracion de VLANs
    banner: false
    vlans_locales: [54, 94, 999]   # en Transparent se crean a mano

  - hostname: SW-PLANTA
    modelo_pt: "Switch-PT (modular)"
    area: "Planta de Produccion"
    rol: "acceso"
    vtp_mode: client
    banner: false

# ---------------------------------------------------------------------------
# ENLACES ENTRE SWITCHES — 15 fisicos, 13 troncales logicos
# medio: utp-cat6 | fibra-om3 | fibra-om4      velocidad: 1G | 100M
# ---------------------------------------------------------------------------
enlaces_switch:
  - {a: [SW-CORE, Gi1/1],  b: [SW-SRV, Gi0/1],       medio: utp-cat6,  velocidad: 1G,   distancia_m: 10,  canal: Po1, allowed: [1,44,94]}
  - {a: [SW-CORE, Gi1/2],  b: [SW-SRV, Gi0/2],       medio: utp-cat6,  velocidad: 1G,   distancia_m: 10,  canal: Po1, allowed: [1,44,94]}
  - {a: [SW-CORE, Gi2/1],  b: [SW-DIST-ID, Gi1/1],   medio: fibra-om4, velocidad: 1G,   distancia_m: 180, canal: Po2, allowed: [1,24,94]}
  - {a: [SW-CORE, Gi2/2],  b: [SW-DIST-ID, Gi1/2],   medio: fibra-om4, velocidad: 1G,   distancia_m: 180, canal: Po2, allowed: [1,24,94]}
  - {a: [SW-CORE, Gi3/1],  b: [SW-DIST-CORP, Gi1/1], medio: fibra-om3, velocidad: 1G,   distancia_m: 120, allowed: [1,14,54,94]}
  - {a: [SW-CORE, Gi4/1],  b: [SW-PLANTA, Gi1/1],    medio: fibra-om3, velocidad: 1G,   distancia_m: 90,  allowed: [1,34,94],
     nota: "fibra por EMI industrial, NO por distancia — es la justificacion clave de §20"}

  - {a: [SW-DIST-ID, Gi2/1], b: [SW-ID-1, Gi0/1],    medio: utp-cat6,  velocidad: 1G,   allowed: [1,24,94]}
  - {a: [SW-DIST-ID, Gi3/1], b: [SW-ID-3, Gi0/1],    medio: utp-cat6,  velocidad: 1G,   allowed: [1,24,94]}
  - {a: [SW-ID-1, Gi0/2],    b: [SW-ID-2, Gi0/1],    medio: utp-cat6,  velocidad: 1G,   allowed: [1,24,94]}
  - {a: [SW-ID-2, Gi0/2],    b: [SW-ID-3, Gi0/2],    medio: utp-cat6,  velocidad: 1G,   allowed: [1,24,94]}
  - {a: [SW-ID-1, Fa0/24],   b: [SW-ID-3, Fa0/24],   medio: utp-cat6,  velocidad: 100M, allowed: [1,24,94],
     nota: "cierre del anillo — costo STP 19 frente a 4: es el candidato al bloqueo"}

  - {a: [SW-DIST-CORP, Gi2/1], b: [SW-ALA-A, Gi0/1],   medio: utp-cat6, velocidad: 1G, allowed: [1,14,94]}
  - {a: [SW-DIST-CORP, Gi3/1], b: [SW-ALA-B, Gi0/1],   medio: utp-cat6, velocidad: 1G, allowed: [1,14,94]}
  - {a: [SW-DIST-CORP, Gi4/1], b: [SW-COMUNES, Gi0/1], medio: utp-cat6, velocidad: 1G, allowed: [1,54,94],
     nota: "SOLO la VLAN 54: aislamiento de visitantes"}
  - {a: [SW-ALA-A, Gi0/2],     b: [SW-ALA-B, Gi0/2],   medio: utp-cat6, velocidad: 1G, distancia_m: 60, allowed: [1,14,94],
     nota: "enlace de respaldo — se espera BLOQUEADO por STP en el extremo SW-ALA-B"}

etherchannels:
  - {id: Po1, extremos: [SW-CORE, SW-SRV],     miembros: 2, protocolo: "lacp active/active", capacidad: "2 Gbps"}
  - {id: Po2, extremos: [SW-CORE, SW-DIST-ID], miembros: 2, protocolo: "lacp active/active", capacidad: "2 Gbps",
     nota: "trunk de mayor ancho de banda del campus — requisito del enunciado"}

# ---------------------------------------------------------------------------
# EQUIPOS FINALES — 24 + 4 servidores + 1 AP + 1 hub
# ---------------------------------------------------------------------------
equipos_finales:
  - {switch: SW-SRV, puertos: [Fa0/1, Fa0/2, Fa0/3, Fa0/4], vlan: 44, tipo: "Server-PT",
     nombres: [SRV-WEB, SRV-BD, SRV-ARCHIVOS, SRV-DNS]}
  - {switch: SW-ID-1, puertos: [Fa0/1, Fa0/2, Fa0/3], vlan: 24, tipo: "PC-PT",
     nombres: [PC-ID-1, PC-ID-2, PC-ID-3]}
  - {switch: SW-ID-2, puertos: [Fa0/1, Fa0/2, Fa0/3], vlan: 24, tipo: "PC-PT",
     nombres: [PC-ID-4, PC-ID-5, PC-ID-6]}
  - {switch: SW-ID-3, puertos: [Fa0/1, Fa0/2], vlan: 24, tipo: "PC-PT",
     nombres: [PC-ID-7, PC-ID-8]}
  - {switch: SW-ALA-A, puertos: [Fa0/1, Fa0/2, Fa0/3], vlan: 14, tipo: "PC-PT",
     nombres: [PC-GER-1, PC-GER-2, PC-GER-3]}
  - {switch: SW-ALA-B, puertos: [Fa0/1, Fa0/2, Fa0/3], vlan: 14, tipo: "PC-PT",
     nombres: [PC-GER-4, PC-GER-5, PC-GER-6]}
  - {switch: SW-COMUNES, puertos: [Fa0/1], vlan: 54, tipo: "AccessPoint-PT",
     nombres: [AP-VISITANTES],
     inalambricos: [LAP-VIS-1, LAP-VIS-2, LAP-VIS-3]}
  - {switch: SW-COMUNES, puertos: [Fa0/2], vlan: 54, tipo: "PC-PT",
     nombres: [PC-VIS-1]}
  - {switch: SW-PLANTA, puertos: [Fa2/1], vlan: 34, tipo: "Hub-PT",
     nombres: [HUB-LEGACY],
     colgados: [PC-MAQ-1, PC-MAQ-2, PC-MAQ-3, PC-MAQ-4],
     nota: "UN solo puerto access. Repartir el hub en varios puertos crearia un bucle."}
  - {switch: SW-PLANTA, puertos: [Fa2/2, Fa2/3], vlan: 34, tipo: "PC-PT",
     nombres: [PC-SUP-1, PC-SUP-2],
     nota: "supervision, fuera del hub, para no compartir el medio degradado"}

puertos_no_utilizados:
  accion: "switchport access vlan 999 + shutdown"
  alcance: "todos los puertos libres de los switches de acceso"
  requisito_enunciado: false   # buena practica anadida, no exigida

# ---------------------------------------------------------------------------
# RESULTADO ESPERADO — para contrastar, no para asumir
# ---------------------------------------------------------------------------
esperado:
  dominios_colision: {total: 54, cableados: 53, inalambricos: 1, compartidos: ["HUB-LEGACY (6 miembros)", "AP-VISITANTES (3 laptops)"]}
  dominios_broadcast: {con_usuarios: 5, vacios: ["94 nativa", "999 sin-uso"]}
  stp_bloqueados:
    - {switch: SW-ALA-B, interfaz: "Gi0/2", vlan: 14, rol: "Altn", estado: "BLK"}
    - {switch: SW-ID-3,  interfaz: "Fa0/24", vlan: 24, rol: "Altn", estado: "BLK"}
    - {switch: SW-ID-2,  interfaz: "Gi0/2",  vlan: 24, rol: "Altn", estado: "BLK"}
  convergencia_stp_s: "30-50"
  convergencia_etherchannel: "inmediata (no hay reconvergencia de STP)"

riesgos_abiertos:
  - id: R1
    descripcion: "No esta verificado que el chasis modular de Packet Tracer acepte
                  'channel-group N mode active' sobre modulos de FIBRA."
    impacto: "Si no lo soporta, Po2 no se forma y hay que replantear la redundancia del trunk de I+D."
    accion: "Probarlo ANTES de cablear el resto."
  - id: R2
    descripcion: "La numeracion slot/puerto de los 4 chasis modulares (Gi1/1, Gi2/1...) es PREVISTA:
                  depende de en que ranura se instale cada modulo."
    impacto: "Los nombres de interfaz de SW-CORE, SW-DIST-ID, SW-DIST-CORP y SW-PLANTA pueden cambiar."
    accion: "Ajustar al armar el .pkt y corregir despues README §14 y §23 y este archivo."
  - id: R3
    descripcion: "'switchport nonegotiate' podria no estar soportado en algun chasis."
    impacto: "Bajo: la proteccion principal contra switch spoofing es el modo de puerto fijado a mano."
    accion: "Si lo rechaza, retirarlo y anotarlo en §22."

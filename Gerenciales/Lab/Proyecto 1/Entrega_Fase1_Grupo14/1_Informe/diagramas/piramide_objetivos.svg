<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="550" y="38" font-family="Segoe UI, Arial" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#1F3A5F" font-weight="bold">Pirámide de objetivos — RutaMoto</text><text x="550" y="66" font-family="Segoe UI, Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#595959">Plan direccional: del propósito a la operación</text><polygon points="395,100 705,100 778.904,222 321.096,222" fill="#1F3A5F" stroke="#FFFFFF" stroke-width="3"/><text x="550" y="139" font-family="Segoe UI, Arial" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-weight="bold">PROPÓSITO</text><text x="550" y="163" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">Que el motociclista consiga el repuesto</text><text x="550" y="182" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">que necesita sin perder el día buscándolo</text><polygon points="316.25,230 783.75,230 857.654,352 242.346,352" fill="#2E5C8A" stroke="#FFFFFF" stroke-width="3"/><text x="550" y="269" font-family="Segoe UI, Arial" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-weight="bold">OBJETIVO ESTRATÉGICO</text><text x="550" y="293" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">Operar una tienda en línea integrada con ERP y CRM que sostenga</text><text x="550" y="312" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">Q 57,000 en ventas durante el primer trimestre de operación</text><polygon points="237.5,360 862.5,360 936.404,482 163.596,482" fill="#D79B00" stroke="#FFFFFF" stroke-width="3"/><text x="550" y="399" font-family="Segoe UI, Arial" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-weight="bold">OBJETIVOS TÁCTICOS</text><text x="550" y="423" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">Captar 350 clientes  ·  Convertir el 2.5% de las visitas</text><text x="550" y="442" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">Entregar el 90% en menos de 24 h  ·  Quiebre de stock bajo 5%</text><polygon points="158.75,490 941.25,490 1015.15,612 84.8462,612" fill="#F2C14E" stroke="#FFFFFF" stroke-width="3"/><text x="550" y="529" font-family="Segoe UI, Arial" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#1A1A1A" font-weight="bold">OBJETIVOS OPERATIVOS</text><text x="550" y="553" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1A1A1A">Catálogo de 36 productos en línea  ·  Cotización a talleres</text><text x="550" y="572" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#1A1A1A">Campañas segmentadas por correo  ·  Reabastecimiento automático</text><text x="1060" y="161" font-family="Segoe UI, Arial" font-size="12" text-anchor="end" dominant-baseline="middle" fill="#595959">Por qué existimos</text><text x="1060" y="291" font-family="Segoe UI, Arial" font-size="12" text-anchor="end" dominant-baseline="middle" fill="#595959">Hacia dónde vamos</text><text x="1060" y="421" font-family="Segoe UI, Arial" font-size="12" text-anchor="end" dominant-baseline="middle" fill="#595959">Cómo lo medimos</text><text x="1060" y="551" font-family="Segoe UI, Arial" font-size="12" text-anchor="end" dominant-baseline="middle" fill="#595959">Qué hacemos cada día</text><text x="550" y="660" font-family="Segoe UI, Arial" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#595959">Cada nivel existe para sostener el de arriba. Leído hacia abajo, cada objetivo se descompone; leído hacia arriba, cada uno aporta al siguiente.</text></svg>